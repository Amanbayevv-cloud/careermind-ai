name: Build and typecheck
on:
  pull_request:
  push:
    branches:
      - main
      - feature/ai-auth-assessment-foundation
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # npm install is temporary until the updated package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - run: npm run build
